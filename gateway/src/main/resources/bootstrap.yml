spring:
  profiles:
    active: dev
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      # 全局的跨域配置
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: hidden-risk-service
          uri: lb://hidden-risk-service
          predicates:
            - Path=/risk/**
    nacos:
      discovery:
        server-addr: 120.26.139.5:8848
        namespace: 18cde16e-ffb2-419f-80bb-5e79a5e4ca95
      config:
        import-check:
          enabled: false
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: yml
        namespace: ${spring.cloud.nacos.discovery.namespace}
        refresh-enabled: true
        shared-configs:
          - ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  main:
    web-application-type: reactive
server:
  port: 8081
