spring:
  profiles:
    active: dev
  application:
    name: flow-service
  cloud:
    nacos:
      discovery:
        server-addr: 120.26.139.5:8848
        namespace: 18cde16e-ffb2-419f-80bb-5e79a5e4ca95
      config:
        import-check:
          enabled: false
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: yml
        namespace: ${spring.cloud.nacos.discovery.namespace}
        refresh-enabled: true
        shared-configs:
          - ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - cache-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - database-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
server:
  port: 8085
  servlet:
    context-path: /flow
#rocketmq配置
rocketmq:
  topic: springboot-mq
  name-server: 127.0.0.1:9876
  # 生产者配置
  producer:
    # 发送同一类消息的设置为同一个group，保证唯一
    group: rocketmq-pro-group
    # 发送消息超时时间,默认3000
    sendMessageTimeout: 3000
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 消息最大长度 默认1024*4(4M)
    maxMessageSize: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
  consumer:
    group: rocketmq-consumer-group
